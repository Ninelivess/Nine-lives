[package]
name = "nine-lives"
description = "Nine Lives: self-living AI cats on NEAR. Each NFT is an autonomous agent with its own account."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Ninelivess/nine-lives"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.16.1-rust-1.86.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
